<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Global Audio Player</title>
    <style>
        /* --- Base Reset --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #121212; /* Dark background for contrast */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* --- Main Player Container --- */
        .player-bar {
            width: 100%;
            max-width: 1600px; /* Wide layout like the image */
            height: 80px;
            background-color: #000000;
            display: flex;
            align-items: center;
            color: #ffffff;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
            overflow: hidden;
        }

        /* --- Left Section: Album Art & Info --- */
        .player-left {
            display: flex;
            align-items: center;
            width: 280px;
            padding-left: 20px;
            flex-shrink: 0;
            border-right: 1px solid #222;
            height: 100%;
        }

        .cover-art {
            width: 48px;
            height: 48px;
            background-color: #333;
            /* Using a placeholder image similar to your screenshot */
            background-image: url('https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=150&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            margin-right: 16px;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .track-title {
            font-size: 16px;
            font-weight: 400;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .track-artist {
            font-size: 13px;
            color: #b3b3b3;
        }

        /* --- Center Section: Controls & Waveform --- */
        .player-center {
            display: flex;
            align-items: center;
            flex-grow: 1;
            height: 100%;
            padding: 0 20px;
            gap: 24px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-shrink: 0;
        }

        .control-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.2s;
            opacity: 0.9;
        }

        .control-btn:hover {
            opacity: 1;
        }

        .control-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }
        
        /* Play / Pause Button */
        .play-btn svg {
            width: 26px;
            height: 26px;
        }

        /* Current Time Display */
        .current-time {
            font-size: 11px;
            color: #fff;
            font-variant-numeric: tabular-nums;
            margin-left: 5px;
            margin-right: 5px;
        }

        /* --- WAVEFORM CONTAINER --- */
        .waveform-container {
            flex-grow: 1;
            height: 40px;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
            min-width: 100px; /* Prevent it from collapsing entirely */
        }

        .waveform-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* The colored, played portion of the waveform */
        .waveform-played {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            width: 0%; /* Controlled by JavaScript */
            border-right: 1px solid #00b09b; /* The playhead line */
        }
        
        .waveform-played svg {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100vw; /* Force exact width match */
            max-width: 1200px;
        }

        /* Base unplayed bars */
        .bar-bg {
            fill: #444; 
        }

        /* Played bars (Teal color from your image) */
        .waveform-played .bar-fg {
            fill: #00e09e; /* Exact mint/teal color */
        }

        /* Remaining Time Display */
        .remaining-time {
            font-size: 11px;
            color: #b3b3b3;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
            margin-left: 10px;
        }

        /* --- Right Section: Action Icons --- */
        .player-right {
            display: flex;
            height: 100%;
            flex-shrink: 0;
            border-left: 1px solid #222;
        }

        .action-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            border-right: 1px solid #222;
            cursor: pointer;
            transition: background 0.2s;
            height: 100%;
        }

        .action-item:hover {
            background-color: #111;
        }

        .action-item svg {
            width: 16px;
            height: 16px;
            fill: #fff;
            margin-bottom: 4px;
        }

        .action-text {
            font-size: 9px;
            color: #fff;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .volume-item {
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .volume-item svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        /* Responsive Adjustments */
        @media (max-width: 1100px) {
            .player-right, .remaining-time { display: none; }
        }
        @media (max-width: 800px) {
            .player-left { width: 200px; }
            .controls { gap: 10px; }
            .control-btn svg { width: 14px; height: 14px; }
            .play-btn svg { width: 20px; height: 20px; }
        }
    </style>
</head>
<body>

    <div class="player-bar">
        
        <!-- Left: Album Art & Info -->
        <div class="player-left">
            <div class="cover-art"></div>
            <div class="track-info">
                <div class="track-title">Tempus Illusio</div>
                <div class="track-artist">Golden Age</div>
            </div>
        </div>

        <!-- Center: Controls & Waveform -->
        <div class="player-center">
            
            <div class="controls">
                <!-- Playlist / Menu (Hamburger lines) -->
                <button class="control-btn" aria-label="Menu">
                    <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
                </button>
                
                <!-- Previous -->
                <button class="control-btn" aria-label="Previous">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                
                <!-- Play / Pause -->
                <button class="control-btn play-btn" id="playPauseBtn" aria-label="Play">
                    <svg id="playIcon" viewBox="0 0 24 24" style="display: none;"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                
                <!-- Next -->
                <button class="control-btn" aria-label="Next">
                    <svg viewBox="0 0 24 24"><path d="M16 18h2V6h-2zM6 18l8.5-6L6 6z"/></svg>
                </button>
                
                <!-- Shuffle -->
                <button class="control-btn" aria-label="Shuffle">
                    <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                </button>
                
                <!-- Repeat -->
                <button class="control-btn" aria-label="Repeat">
                    <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                </button>

                <!-- Current Time -->
                <span class="current-time" id="currentTime">00:11</span>
            </div>

            <!-- Waveform Area -->
            <div class="waveform-container" id="waveform">
                <!-- Base Layer (Gray) -->
                <svg class="waveform-svg" id="waveSvgBg" preserveAspectRatio="none"></svg>
                <!-- Played Layer (Teal) -->
                <div class="waveform-played" id="wavePlayedContainer">
                    <svg class="waveform-svg" id="waveSvgFg" preserveAspectRatio="none"></svg>
                </div>
            </div>

            <!-- Remaining Time -->
            <span class="remaining-time" id="remainingTime">-00:00</span>
        </div>

        <!-- Right: Action Icons -->
        <div class="player-right">
            <!-- Download -->
            <div class="action-item">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                <span class="action-text">Download</span>
            </div>
            <!-- Spotify -->
            <div class="action-item">
                <svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
                <span class="action-text">Spotify</span>
            </div>
            <!-- SoundCloud -->
            <div class="action-item">
                <svg viewBox="0 0 24 24"><path d="M2 12.5c0 .55.45 1 1 1s1-.45 1-1V8.75c0-.55-.45-1-1-1s-1 .45-1 1v3.75zM5 13.5c0 .55.45 1 1 1s1-.45 1-1v-5.5c0-.55-.45-1-1-1s-1 .45-1 1v5.5zM8 14.5c0 .55.45 1 1 1s1-.45 1-1v-7c0-.55-.45-1-1-1s-1 .45-1 1v7zm3 0c0 .55.45 1 1 1s1-.45 1-1V6c0-.55-.45-1-1-1s-1 .45-1 1v8.5zm3 0c0 .55.45 1 1 1s1-.45 1-1V4c0-.55-.45-1-1-1s-1 .45-1 1v10.5zm3 0c0 .55.45 1 1 1s1-.45 1-1V5c0-.55-.45-1-1-1s-1 .45-1 1v9.5zm3 0c0 .55.45 1 1 1s1-.45 1-1v-5c0-.55-.45-1-1-1s-1 .45-1 1v5zM23 13c0-1.66-1.34-3-3-3-.33 0-.65.06-.94.16C18.5 7.93 16.42 6.4 14 6.4c-1.1 0-2.1.3-3 .8v7.8c.9.5 1.9.8 3 .8 2.76 0 5-2.24 5-5 0-.35-.04-.69-.1-1.02.33-.16.7-.26 1.1-.26 1.38 0 2.5 1.12 2.5 2.5 0 .28-.05.55-.14.8.35.15.64.46.64.84z"/></svg>
                <span class="action-text">Soundcloud</span>
            </div>
            <!-- Volume -->
            <div class="volume-item">
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </div>
        </div>

    </div>

    <script>
        // DOM Elements
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const waveformContainer = document.getElementById('waveform');
        const waveSvgBg = document.getElementById('waveSvgBg');
        const waveSvgFg = document.getElementById('waveSvgFg');
        const wavePlayedContainer = document.getElementById('wavePlayedContainer');
        const currentTimeDisplay = document.getElementById('currentTime');
        const remainingTimeDisplay = document.getElementById('remainingTime');

        // State
        let isPlaying = true; // Start playing automatically to match image (pause icon visible)
        let progress = 11; // Start at 11 seconds to match image
        let totalDurationSeconds = 225; // 3:45
        let animationInterval;
        
        // Waveform Settings
        const barCount = 250; // High number for dense, thin lines
        const barWidth = 1;
        const barGap = 2; 

        // 1. Generate Realistic Waveform
        function generateWaveform() {
            let bgHtml = '';
            let fgHtml = '';
            
            // Use a combination of math functions to simulate a complex audio wave
            for (let i = 0; i < barCount; i++) {
                // Envelope: creates a wave that goes up and down
                let envelope1 = Math.sin((i / barCount) * Math.PI * 3); 
                let envelope2 = Math.sin((i / barCount) * Math.PI * 10) * 0.5;
                
                // Add random noise
                let noise = Math.random(); 
                
                // Combine and normalize
                let heightPercent = Math.abs(envelope1 * 0.5 + envelope2 * 0.5 + noise * 0.4) * 80 + 10;
                
                // Ensure minimum visible height so it looks solid
                if (heightPercent < 15) heightPercent = 15; 

                let x = i * (barWidth + barGap);
                let y = 50 - (heightPercent / 2);
                
                // Draw symmetrical bars from the center
                let rect = `<rect class="bar-bg" x="${x}" y="${y}%" width="${barWidth}" height="${heightPercent}%" rx="0.5"></rect>`;
                let rectFg = `<rect class="bar-fg" x="${x}" y="${y}%" width="${barWidth}" height="${heightPercent}%" rx="0.5"></rect>`;
                
                bgHtml += rect;
                fgHtml += rectFg; 
            }

            waveSvgBg.innerHTML = bgHtml;
            waveSvgFg.innerHTML = fgHtml;
            
            // Set viewBox exactly to the drawn width
            const totalWidth = barCount * (barWidth + barGap);
            waveSvgBg.setAttribute('viewBox', `0 0 ${totalWidth} 100`);
            waveSvgFg.setAttribute('viewBox', `0 0 ${totalWidth} 100`);
        }

        // 2. Format Time (MM:SS)
        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min < 10 ? '0' : ''}${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // 3. Update UI
        function updateUI() {
            // Update Played Width (Teal progress)
            const percent = progress + '%';
            wavePlayedContainer.style.width = percent;
            
            // Calculate Times
            const currentSeconds = (progress / 100) * totalDurationSeconds;
            const remainingSeconds = totalDurationSeconds - currentSeconds;
            
            currentTimeDisplay.textContent = formatTime(currentSeconds);
            // Match image format for remaining time
            remainingTimeDisplay.textContent = `-${formatTime(remainingSeconds)}`;
        }

        // 4. Play / Pause Logic
        function togglePlay() {
            isPlaying = !isPlaying;
            
            if (isPlaying) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                
                animationInterval = setInterval(() => {
                    if (progress < 100) {
                        // Increment speed (adjust for realism)
                        progress += (0.1 / totalDurationSeconds) * 100; 
                        if (progress > 100) progress = 100;
                        updateUI();
                    } else {
                        clearInterval(animationInterval);
                        isPlaying = false;
                        playIcon.style.display = 'block';
                        pauseIcon.style.display = 'none';
                    }
                }, 100);
            } else {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                clearInterval(animationInterval);
            }
        }

        // Event Listeners
        playPauseBtn.addEventListener('click', togglePlay);

        // Seek on Waveform Click
        waveformContainer.addEventListener('click', (e) => {
            const rect = waveformContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            
            let newProgress = (clickX / width) * 100;
            newProgress = Math.max(0, Math.min(100, newProgress));
            
            progress = newProgress;
            updateUI();
        });

        // Initialize
        generateWaveform();
        updateUI();
        
        // Auto-start simulation
        togglePlay(); 
    </script>
</body>
</html>
