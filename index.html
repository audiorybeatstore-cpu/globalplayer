<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeatStars Player - Real Waveform Test</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background-color: #121212; }
        ::-webkit-scrollbar { display: none; }
        
        #waveformCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #clickOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body class="flex justify-center items-center h-screen font-sans antialiased select-none text-white">

    <!-- RELIABLE, CORS-FRIENDLY AUDIO SOURCE -->
    <audio id="audioPlayer" crossorigin="anonymous" preload="auto" src="https://incompetech.com/music/royalty-free/mp3-royaltyfree/Cheerful%20Annoyance.mp3"></audio>

    <!-- Main Player Container -->
    <div class="w-full max-w-[1400px] bg-[#0a0a0a] flex flex-col border-t border-b border-[#222]">
        
        <!-- TOP ROW: True Waveform & Times -->
        <div class="flex items-center w-full px-6 pt-5 pb-3 gap-4">
            <span id="currentTime" class="text-[13px] font-medium text-gray-400 tabular-nums w-10 text-right">0:00</span>
            
            <div id="waveformWrapper" class="flex-grow h-[60px] relative flex items-center justify-center">
                <!-- Loading Text -->
                <div id="loadingText" class="absolute text-xs text-gray-500 animate-pulse z-0">Loading real audio data...</div>
                
                <canvas id="waveformCanvas" class="relative z-10"></canvas>
                <div id="clickOverlay"></div>
            </div>

            <span id="durationTime" class="text-[13px] font-medium text-gray-400 tabular-nums w-10 text-left">0:00</span>
        </div>

        <!-- BOTTOM ROW: Track Info & Controls -->
        <div class="flex items-center justify-between px-6 pb-5 pt-2">
            
            <!-- Left: Cover Art & Title -->
            <div class="flex items-center gap-4 w-[380px]">
                <div class="w-[60px] h-[60px] bg-[#222] bg-cover bg-center rounded-md shrink-0 shadow-lg" style="background-image: url('https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=150&auto=format&fit=crop');"></div>
                
                <div class="flex flex-col truncate">
                    <div class="text-[15px] font-semibold text-white tracking-wide truncate">Cheerful Annoyance (Test Track)</div>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="text-[13px] text-gray-400">Kevin MacLeod</span>
                        <svg class="w-3.5 h-3.5 fill-[#1d9bf0]" viewBox="0 0 24 24"><path d="M22.5 12.5c0-1.58-.875-2.95-2.148-3.6.154-.435.238-.905.238-1.4 0-2.21-1.71-3.998-3.918-3.998-.47 0-.92.084-1.336.25C14.818 2.415 13.51 1.5 12 1.5s-2.816.917-3.337 2.25c-.416-.165-.866-.25-1.336-.25-2.21 0-3.918 1.79-3.918 4 0 .495.084.965.238 1.4-1.273.65-2.148 2.02-2.148 3.6 0 1.46.755 2.73 1.882 3.44-.04.18-.062.37-.062.56 0 2.21 1.71 3.998 3.918 3.998.47 0 .92-.084 1.336-.25.52 1.333 1.828 2.25 3.337 2.25s2.816-.917 3.337-2.25c.416.165.866.25 1.336.25 2.21 0 3.918-1.79 3.918-4 0-.19-.022-.38-.062-.56 1.127-.71 1.882-1.98 1.882-3.44zM12 15.5c-1.933 0-3.5-1.567-3.5-3.5s1.567-3.5 3.5-3.5 3.5 1.567 3.5 3.5-1.567 3.5-3.5 3.5z"/></svg>
                        <span class="text-[12px] text-gray-600">&bull;</span>
                        <span class="text-[12px] text-gray-400">120 BPM</span>
                    </div>
                </div>
            </div>

            <!-- Center: Controls -->
            <div class="flex items-center gap-7">
                <button class="text-gray-400 hover:text-white transition-colors">
                    <svg class="w-6 h-6 stroke-current fill-transparent" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg>
                </button>
                <button class="text-gray-400 hover:text-white transition-colors">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                
                <button id="playPauseBtn" class="text-white hover:scale-110 transition-transform flex items-center justify-center cursor-pointer">
                    <svg id="playIcon" class="w-9 h-9 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" class="w-9 h-9 fill-current hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                
                <button class="text-gray-400 hover:text-white transition-colors">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M16 18h2V6h-2zM6 18l8.5-6L6 6z"/></svg>
                </button>
                <button class="text-gray-400 hover:text-white transition-colors">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
                </button>
            </div>

            <!-- Right: Actions -->
            <div class="flex items-center gap-5 w-[380px] justify-end">
                <button class="flex items-center gap-1.5 text-gray-400 hover:text-white transition-colors">
                    <svg class="w-4 h-4 stroke-current fill-transparent" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                    <span class="text-[13px] font-medium">Edit</span>
                </button>
                <button class="flex items-center gap-1.5 text-gray-400 hover:text-white transition-colors">
                    <svg class="w-4 h-4 stroke-current fill-transparent" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                    <span class="text-[13px] font-medium">Loop</span>
                </button>
                <button class="flex items-center gap-1.5 text-gray-400 hover:text-white transition-colors">
                    <svg class="w-4 h-4 stroke-current fill-transparent" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                    <span class="text-[13px] font-medium">Lyrics</span>
                </button>
                <button class="text-gray-400 hover:text-white transition-colors">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                </button>
                <button class="text-gray-400 hover:text-white transition-colors">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                </button>
                <button class="flex items-center gap-2 bg-[#007bff] hover:bg-blue-600 transition-colors px-5 py-2.5 rounded-md ml-2 shadow-lg shadow-blue-500/20">
                    <svg class="w-4 h-4 fill-white" viewBox="0 0 24 24"><path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h14v12zm-7-8c-1.66 0-3-1.34-3-3H7c0 2.76 2.24 5 5 5s5-2.24 5-5h-2c0 1.66-1.34 3-3 3z"/></svg>
                    <span class="text-[14px] font-semibold text-white">$51.00</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const currentTimeDisplay = document.getElementById('currentTime');
        const durationTimeDisplay = document.getElementById('durationTime');
        const canvas = document.getElementById('waveformCanvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('waveformWrapper');
        const clickOverlay = document.getElementById('clickOverlay'); 
        const loadingText = document.getElementById('loadingText');

        let audioBuffer = null;
        let peaks = [];
        let isSeeking = false; 

        const colorUnplayed = '#4b5563'; 
        const colorPlayed = '#ffffff';   
        const colorLine = '#ffffff';     

        // 1. Fetch the REAL audio data
        function loadAudioData() {
            // Create an XHR request to fetch the raw MP3 data
            const xhr = new XMLHttpRequest();
            xhr.open('GET', audio.src, true);
            xhr.responseType = 'arraybuffer';

            xhr.onload = function() {
                if (this.status === 200) {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    // Decode the actual audio into mathematical data
                    audioContext.decodeAudioData(this.response, function(buffer) {
                        audioBuffer = buffer;
                        
                        // Extract the real visual peaks from the data
                        extractPeaks(audioBuffer);
                        
                        // Hide loading text and draw
                        loadingText.style.display = 'none';
                        drawWaveform(0);
                        durationTimeDisplay.textContent = formatTime(audio.duration);
                    }, function(e) {
                        loadingText.textContent = "Error decoding audio.";
                        console.error("Error decoding audio data", e);
                    });
                }
            };
            
            xhr.onerror = function() {
                loadingText.textContent = "Network Error (CORS).";
            };
            
            xhr.send();
        }

        function extractPeaks(buffer) {
            const channelData = buffer.getChannelData(0); 
            // Divide into 1000 chunks to get the overall shape
            const step = Math.ceil(channelData.length / 1000); 
            
            for (let i = 0; i < channelData.length; i += step) {
                let min = 1.0; let max = -1.0;
                for (let j = 0; j < step && (i + j) < channelData.length; j++) {
                    const datum = channelData[i + j];
                    if (datum < min) min = datum;
                    if (datum > max) max = datum;
                }
                // The peak is the distance between min and max
                peaks.push(Math.max(Math.abs(min), Math.abs(max)));
            }
        }

        // 2. Draw the exact data
        function drawWaveform(overrideProgress = null) {
            if (!peaks.length) return;

            const dpr = window.devicePixelRatio || 1;
            const width = wrapper.clientWidth;
            const height = wrapper.clientHeight;
            
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);

            const totalBars = peaks.length;
            const barWidth = 2;
            const gap = 1;
            const barSpacing = barWidth + gap;
            const visibleBars = Math.floor(width / barSpacing);
            const barStep = totalBars / visibleBars; 

            ctx.clearRect(0, 0, width, height);

            let progressRatio = overrideProgress !== null ? overrideProgress : (audio.currentTime / (audio.duration || 1));

            for (let i = 0; i < visibleBars; i++) {
                const peakIndex = Math.floor(i * barStep);
                let peak = peaks[peakIndex] || 0;
                
                // Multiply peak by height to stretch it out
                let barHeight = Math.max(2, peak * height * 2.5);
                // Clamp to max height
                if (barHeight > height) barHeight = height;
                
                const x = i * barSpacing;
                const y = (height - barHeight) / 2;
                const barProgress = x / width;
                
                ctx.fillStyle = barProgress <= progressRatio ? colorPlayed : colorUnplayed;

                ctx.beginPath();
                if (ctx.roundRect) { ctx.roundRect(x, y, barWidth, barHeight, 1); } 
                else { ctx.rect(x, y, barWidth, barHeight); }
                ctx.fill();
            }

            const playheadX = width * progressRatio;
            ctx.fillStyle = colorLine;
            ctx.fillRect(playheadX, 0, 2, height);
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // 3. The Fix for Snapping Back
        audio.addEventListener('timeupdate', () => {
            if (isSeeking) return; // Ignore audio resets while clicking
            currentTimeDisplay.textContent = formatTime(audio.currentTime);
            drawWaveform(); 
        });

        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play();
                playIcon.classList.add('hidden');
                pauseIcon.classList.remove('hidden');
            } else {
                audio.pause();
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
            }
        });

        clickOverlay.addEventListener('mousedown', (e) => {
            isSeeking = true;
            
            const rect = clickOverlay.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            const seekPercent = Math.max(0, Math.min(1, clickX / width));

            // Draw instantly
            drawWaveform(seekPercent);
            currentTimeDisplay.textContent = formatTime(seekPercent * audio.duration);

            // Set audio 
            try {
                audio.currentTime = seekPercent * audio.duration;
            } catch (err) {}

            setTimeout(() => { isSeeking = false; }, 150); 
        });

        clickOverlay.addEventListener('mouseup', () => { isSeeking = false; });
        clickOverlay.addEventListener('mouseleave', () => { isSeeking = false; });

        window.addEventListener('resize', () => {
            clearTimeout(window.resizeTimer);
            window.resizeTimer = setTimeout(() => drawWaveform(), 100);
        });

        // Start Loading
        loadAudioData();
    </script>
</body>
</html>
