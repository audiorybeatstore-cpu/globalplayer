<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonaar Global - Audio Player & Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Keyframe Animations for the Soundwave Visualizer */
        @keyframes bounce-wave {
            0% { transform: scaleY(0.15); }
            100% { transform: scaleY(1); }
        }
        .animate-wave {
            transform-origin: bottom;
            animation: bounce-wave 1.2s ease-in-out infinite alternate;
        }
        .animate-wave-paused {
            animation-play-state: paused !important;
            transform: scaleY(0.2) !important;
        }
        /* Custom range slider styling */
        input[type="range"] {
            accent-color: #10b981;
        }
        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen pb-28 font-sans selection:bg-emerald-500 selection:text-black">

    <!-- Persistent Header Navigation Component -->
    <nav class="bg-black/80 backdrop-blur-md sticky top-0 z-50 border-b border-zinc-900 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-emerald-500 flex items-center justify-center font-bold text-black text-xl tracking-wider shadow-lg shadow-emerald-500/20">S</div>
            <span class="font-bold tracking-tight text-xl bg-gradient-to-r from-white via-zinc-200 to-zinc-400 bg-clip-text text-transparent">SONAAR<span class="text-emerald-500 font-light text-xs ml-1.5 tracking-widest uppercase">Global</span></span>
        </div>
        <div class="flex gap-6 font-medium text-sm">
            <button onclick="navigateTo('home')" id="nav-home" class="transition-colors cursor-pointer text-emerald-400 font-semibold flex items-center gap-2">
                <span>Home Hub</span>
            </button>
            <button onclick="navigateTo('about')" id="nav-about" class="transition-colors cursor-pointer text-zinc-400 hover:text-zinc-200 flex items-center gap-2">
                <span>About Band</span>
            </button>
            <button onclick="navigateTo('contact')" id="nav-contact" class="transition-colors cursor-pointer text-zinc-400 hover:text-zinc-200 flex items-center gap-2">
                <span>Bookings</span>
            </button>
        </div>
    </nav>

    <!-- Content Target: Dynamic SPA area that updates without interrupting playback -->
    <main id="content-area" class="max-w-4xl mx-auto px-6 py-10 transition-all duration-300">
        <!-- SPA JavaScript renders views here -->
    </main>

    <!-- Hidden Native Audio Engine -->
    <audio id="global-audio" preload="metadata"></audio>

    <!-- Sticky Bottom Persistent Global Audio Player -->
    <div class="fixed bottom-0 left-0 right-0 h-24 bg-zinc-900/95 backdrop-blur-xl border-t border-zinc-800/80 px-6 flex flex-col justify-center gap-1 z-50 shadow-2xl">
        
        <!-- Interactive Seek Bar Line -->
        <div class="absolute top-0 left-0 right-0 flex items-center group cursor-pointer h-1.5 -translate-y-1/2">
            <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1" oninput="seekAudio(this.value)" class="w-full h-1 group-hover:h-2 bg-zinc-800 cursor-pointer appearance-none transition-all outline-none">
        </div>

        <div class="flex items-center justify-between w-full mt-1">
            <!-- Left: Artwork & Metadata -->
            <div class="flex items-center gap-4 w-1/3 min-w-[200px]">
                <img id="player-art" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150&auto=format&fit=crop&q=80" alt="Cover Art" class="w-14 h-14 rounded-lg object-cover bg-zinc-800 shadow-md transition-all duration-300 border border-zinc-800/80">
                <div class="truncate">
                    <h4 id="player-title" class="font-semibold text-sm text-zinc-100 truncate">No Track Selected</h4>
                    <p id="player-artist" class="text-xs text-zinc-400 truncate mt-0.5">Click Play to begin listening</p>
                </div>
            </div>

            <!-- Center: Player Controls & Time -->
            <div class="flex flex-col items-center gap-1.5 w-1/3">
                <div class="flex items-center gap-6">
                    <button onclick="playPrevious()" class="text-zinc-400 hover:text-white transition-colors cursor-pointer text-lg p-1" title="Previous Track">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button onclick="togglePlay()" id="playPause" class="w-11 h-11 rounded-full bg-emerald-500 text-black flex items-center justify-center font-bold hover:scale-105 transition-transform shadow-lg shadow-emerald-500/20 cursor-pointer" title="Play/Pause">
                        <svg class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <button onclick="playNext()" class="text-zinc-400 hover:text-white transition-colors cursor-pointer text-lg p-1" title="Next Track">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zm-10.5 0v12l8.5-6z"/></svg>
                    </button>
                </div>
                <!-- Track Time Counter -->
                <div class="flex items-center gap-2 text-[11px] text-zinc-400 font-mono tracking-wider">
                    <span id="time-current">00:00</span>
                    <span class="text-zinc-600">/</span>
                    <span id="time-total">00:00</span>
                </div>
            </div>

            <!-- Right: Dynamic Visualizer & Volume Bar -->
            <div class="flex items-center justify-end gap-6 w-1/3">
                <!-- Soundwave Visualizer Bars -->
                <div id="visualizer" class="flex items-end gap-1 h-6 w-16 opacity-30 transition-opacity duration-300">
                    <div class="w-1 h-full bg-emerald-400 rounded-t-sm animate-wave animate-wave-paused" style="animation-delay: 0.1s; animation-duration: 0.8s;"></div>
                    <div class="w-1 h-full bg-emerald-400 rounded-t-sm animate-wave animate-wave-paused" style="animation-delay: 0.4s; animation-duration: 1.2s;"></div>
                    <div class="w-1 h-full bg-emerald-400 rounded-t-sm animate-wave animate-wave-paused" style="animation-delay: 0.2s; animation-duration: 0.6s;"></div>
                    <div class="w-1 h-full bg-emerald-400 rounded-t-sm animate-wave animate-wave-paused" style="animation-delay: 0.6s; animation-duration: 1.0s;"></div>
                    <div class="w-1 h-full bg-emerald-400 rounded-t-sm animate-wave animate-wave-paused" style="animation-delay: 0.3s; animation-duration: 0.7s;"></div>
                    <div class="w-1 h-full bg-emerald-400 rounded-t-sm animate-wave animate-wave-paused" style="animation-delay: 0.5s; animation-duration: 1.3s;"></div>
                    <div class="w-1 h-full bg-emerald-400 rounded-t-sm animate-wave animate-wave-paused" style="animation-delay: 0.1s; animation-duration: 0.9s;"></div>
                </div>

                <!-- Volume Slider -->
                <div class="flex items-center gap-2">
                    <button onclick="toggleMute()" id="mute-btn" class="text-zinc-400 hover:text-white transition-colors cursor-pointer">
                        <svg id="volume-icon" class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M12 18.75V5.25L7.75 9.5H4.5v5h3.25L12 18.75z"/></svg>
                    </button>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.8" oninput="adjustVolume(this.value)" class="w-20 h-1 bg-zinc-700 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
        </div>
    </div>

    <!-- Application Script Engine -->
    <script>
        // Track Inventory Database with direct public MP3 audio clips & cover art
        const playlist = [
            { 
                id: 0, 
                title: "Acoustic Breeze", 
                artist: "Benjamin Tissot", 
                src: "https://www.bensound.com/bensound-music/bensound-acousticbreeze.mp3", 
                art: "https://images.unsplash.com/photo-1510915361894-db8b60106cb1?w=300&auto=format&fit=crop&q=80",
                duration: "02:37"
            },
            { 
                id: 1, 
                title: "Creative Minds", 
                artist: "Benjamin Tissot", 
                src: "https://www.bensound.com/bensound-music/bensound-creativeminds.mp3", 
                art: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=300&auto=format&fit=crop&q=80",
                duration: "02:27"
            },
            { 
                id: 2, 
                title: "Ukulele Joyride", 
                artist: "Benjamin Tissot", 
                src: "https://www.bensound.com/bensound-music/bensound-ukulele.mp3", 
                art: "https://images.unsplash.com/photo-1465847899084-d164df4dedc6?w=300&auto=format&fit=crop&q=80",
                duration: "02:26"
            },
            { 
                id: 3, 
                title: "Sunny Side Up", 
                artist: "Benjamin Tissot", 
                src: "https://www.bensound.com/bensound-music/bensound-sunny.mp3", 
                art: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300&auto=format&fit=crop&q=80",
                duration: "02:20"
            }
        ];

        let currentTrackIndex = 0;
        let isMuted = false;
        let lastVolume = 0.8;

        const audio = document.getElementById('global-audio');
        const playPauseBtn = document.getElementById('playPause');
        const visualizer = document.getElementById('visualizer');
        const progressBar = document.getElementById('progress-bar');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');
        const volumeSlider = document.getElementById('volume-slider');

        // Initial Audio Configurations
        audio.volume = 0.8;

        // Core Player Engine Event Handlers
        audio.addEventListener('play', () => {
            playPauseBtn.innerHTML = `<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
            visualizer.classList.remove('opacity-30');
            visualizer.classList.add('opacity-100');
            document.querySelectorAll('#visualizer div').forEach(bar => bar.classList.remove('animate-wave-paused'));
            toggleInlineButtonState(currentTrackIndex, true);
        });

        audio.addEventListener('pause', () => {
            playPauseBtn.innerHTML = `<svg class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
            visualizer.classList.add('opacity-30');
            visualizer.classList.remove('opacity-100');
            document.querySelectorAll('#visualizer div').forEach(bar => bar.classList.add('animate-wave-paused'));
            toggleInlineButtonState(currentTrackIndex, false);
        });

        audio.addEventListener('timeupdate', () => {
            if (!isNaN(audio.duration) && audio.duration > 0) {
                const percentage = (audio.currentTime / audio.duration) * 100;
                progressBar.value = percentage;
                timeCurrent.innerText = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            timeTotal.innerText = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            playNext();
        });

        // Player Control Functions
        function loadTrack(index) {
            toggleInlineButtonState(currentTrackIndex, false);
            currentTrackIndex = index;
            const track = playlist[index];
            audio.src = track.src;
            document.getElementById('player-title').innerText = track.title;
            document.getElementById('player-artist').innerText = track.artist;
            document.getElementById('player-art').src = track.art;
        }

        function playTrack(index) {
            if (currentTrackIndex !== index || !audio.src) {
                loadTrack(index);
                audio.play().catch(err => console.log("User interaction required for autoplay:", err));
            } else {
                if (audio.paused) {
                    audio.play().catch(err => console.log("Error playing audio:", err));
                } else {
                    audio.pause();
                }
            }
        }

        function togglePlay() {
            if (!audio.src) {
                loadTrack(0);
            }
            if (audio.paused) {
                audio.play().catch(err => console.log("User gesture requirement protection triggered.", err));
            } else {
                audio.pause();
            }
        }

        function playNext() {
            let nextIndex = (currentTrackIndex + 1) % playlist.length;
            playTrack(nextIndex);
        }

        function playPrevious() {
            let prevIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            playTrack(prevIndex);
        }

        function seekAudio(value) {
            if (audio.duration) {
                audio.currentTime = (value / 100) * audio.duration;
            }
        }

        function adjustVolume(val) {
            audio.volume = val;
            lastVolume = val;
            isMuted = val == 0;
            updateVolumeIcon();
        }

        function toggleMute() {
            if (isMuted) {
                audio.volume = lastVolume || 0.8;
                volumeSlider.value = audio.volume;
                isMuted = false;
            } else {
                lastVolume = audio.volume;
                audio.volume = 0;
                volumeSlider.value = 0;
                isMuted = true;
            }
            updateVolumeIcon();
        }

        function updateVolumeIcon() {
            const iconContainer = document.getElementById('volume-icon');
            if (audio.volume === 0 || isMuted) {
                iconContainer.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" clip-rule="evenodd" /><path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />`;
            } else {
                iconContainer.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M12 18.75V5.25L7.75 9.5H4.5v5h3.25L12 18.75z"/>`;
            }
        }

        function formatTime(secs) {
            const minutes = Math.floor(secs / 60) || 0;
            const seconds = Math.floor(secs % 60) || 0;
            return `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        function toggleInlineButtonState(index, isPlaying) {
            const btn = document.getElementById(`inline-btn-${index}`);
            if (btn) {
                btn.innerText = isPlaying ? "Pause Track" : "Play Track";
                if (isPlaying) {
                    btn.classList.replace('bg-emerald-500', 'bg-zinc-700');
                    btn.classList.replace('text-black', 'text-white');
                } else {
                    btn.classList.replace('bg-zinc-700', 'bg-emerald-500');
                    btn.classList.replace('text-white', 'text-black');
                }
            }
        }

        // Single Page Application Dynamic View Templates
        const pages = {
            home: `
                <div class="space-y-8 animate-fadeIn">
                    <header class="space-y-2 border-b border-zinc-800 pb-6">
                        <span class="text-xs font-semibold tracking-wider text-emerald-400 uppercase">Featured Playlist</span>
                        <h1 class="text-3xl font-extrabold text-white tracking-tight sm:text-4xl">Fresh Audio Drops</h1>
                        <p class="text-zinc-400 text-sm max-w-2xl">
                            Stream uninterrupted royalty-free tracks while exploring our platform without losing your audio playback state.
                        </p>
                    </header>

                    <div class="space-y-3">
                        ${playlist.map(track => `
                            <div class="bg-zinc-900/60 border border-zinc-800/80 p-4 rounded-xl flex items-center justify-between hover:border-zinc-700/80 transition-all group shadow-md hover:bg-zinc-900">
                                <div class="flex items-center gap-4">
                                    <img src="${track.art}" alt="${track.title}" class="w-12 h-12 rounded-lg object-cover bg-zinc-800 shadow-sm border border-zinc-800">
                                    <div>
                                        <h3 class="font-semibold text-zinc-100 text-base group-hover:text-emerald-400 transition-colors">${track.title}</h3>
                                        <p class="text-xs text-zinc-400 font-medium mt-0.5">${track.artist}</p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-4">
                                    <span class="text-xs font-mono text-zinc-500 hidden sm:inline">${track.duration}</span>
                                    <button id="inline-btn-${track.id}" onclick="playTrack(${track.id})" class="bg-emerald-500 text-black text-xs font-bold px-5 py-2.5 rounded-full hover:scale-105 transition-all cursor-pointer shadow-md shadow-emerald-500/10">
                                        Play Track
                                    </button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `,
            about: `
                <div class="space-y-6 animate-fadeIn">
                    <header class="space-y-2 border-b border-zinc-800 pb-6">
                        <span class="text-xs font-semibold tracking-wider text-emerald-400 uppercase">Behind the Sound</span>
                        <h1 class="text-3xl font-extrabold text-white tracking-tight sm:text-4xl">Seamless Architecture</h1>
                        <p class="text-zinc-400 text-sm max-w-2xl">
                            This view was updated dynamically without reloading your browser frame. That means your playback buffer, global audio nodes, and runtime state continue running non-stop.
                        </p>
                    </header>

                    <div class="grid gap-6 md:grid-cols-2">
                        <div class="bg-zinc-900/60 border border-zinc-800 p-6 rounded-2xl space-y-3">
                            <div class="w-10 h-10 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center font-bold text-lg">⚡</div>
                            <h3 class="text-lg font-bold text-white">Global Player Node</h3>
                            <p class="text-xs text-zinc-400 leading-relaxed">
                                By placing the native HTML5 audio element outside the dynamic view lifecycle, music playback remains completely uninterrupted during client-side route changes.
                            </p>
                        </div>
                        <div class="bg-zinc-900/60 border border-zinc-800 p-6 rounded-2xl space-y-3">
                            <div class="w-10 h-10 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center font-bold text-lg">🎛️</div>
                            <h3 class="text-lg font-bold text-white">Sonaar Engine Design</h3>
                            <p class="text-xs text-zinc-400 leading-relaxed">
                                Inspired by premium beat store and continuous radio player layouts. Modular JavaScript controls volume, seek positions, and soundwave animation states natively.
                            </p>
                        </div>
                    </div>
                </div>
            `,
            contact: `
                <div class="space-y-6 animate-fadeIn">
                    <header class="space-y-2 border-b border-zinc-800 pb-6">
                        <span class="text-xs font-semibold tracking-wider text-emerald-400 uppercase">Bookings & Management</span>
                        <h1 class="text-3xl font-extrabold text-white tracking-tight sm:text-4xl">Get In Touch</h1>
                        <p class="text-zinc-400 text-sm max-w-2xl">
                            Want to schedule a live show, register beat rights, or collaborate on continuous audio player integrations? Send us a message below.
                        </p>
                    </header>

                    <form onsubmit="event.preventDefault(); alert('Booking request sent successfully!');" class="space-y-4 max-w-xl bg-zinc-900/60 border border-zinc-800 p-6 rounded-2xl shadow-xl">
                        <div>
                            <label class="block text-xs font-semibold text-zinc-400 mb-1">Your Name</label>
                            <input type="text" placeholder="John Doe" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-emerald-500 transition-colors">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-zinc-400 mb-1">Email Address</label>
                            <input type="email" placeholder="john@example.com" required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-emerald-500 transition-colors">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-zinc-400 mb-1">Event or Inquiry Details</label>
                            <textarea rows="4" placeholder="Tell us about your event date or requirements..." required class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2.5 text-sm text-zinc-100 focus:outline-none focus:border-emerald-500 transition-colors"></textarea>
                        </div>
                        <button type="submit" class="w-full bg-emerald-500 text-black font-bold text-sm py-3 rounded-lg hover:bg-emerald-400 transition-colors shadow-lg shadow-emerald-500/20 cursor-pointer">
                            Submit Application
                        </button>
                    </form>
                </div>
            `
        };

        // Navigation Controller
        function navigateTo(pageId) {
            // Swap View Content
            document.getElementById('content-area').innerHTML = pages[pageId];
            
            // Adjust Active Navigation Styling
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('text-emerald-400', 'font-semibold');
                btn.classList.add('text-zinc-400');
            });
            const activeLink = document.getElementById(`nav-${pageId}`);
            if (activeLink) {
                activeLink.classList.remove('text-zinc-400');
                activeLink.classList.add('text-emerald-400', 'font-semibold');
            }

            // Sync structural inline play state indicators on DOM repaint
            if (!audio.paused && currentTrackIndex !== null) {
                toggleInlineButtonState(currentTrackIndex, true);
            }
        }

        // Initialize App Landing View
        navigateTo('home');
        loadTrack(0);
    </script>
</body>
</html>
