<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Audio Player - Sonaar Waveform UI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
    <style>
        /* Sonaar Waveform Container Overlay */
        .sonaar-wave-wrapper {
            position: relative;
            width: 100%;
            height: 48px;
            cursor: pointer;
            user-select: none;
            overflow: hidden;
        }
        .sonaar_wave_base, .sonaar_wave_cut {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
        }
        .sonaar_wave_base canvas, .sonaar_wave_cut canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .sonaar_wave_cut {
            width: 0%;
            overflow: hidden;
            transition: width 0.05s linear;
        }

        /* Scrubber playhead line */
        .scrubber-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #34d399;
            box-shadow: 0 0 8px rgba(52, 211, 153, 0.8);
            pointer-events: none;
            z-index: 10;
        }

        /* Equalizer Wave Bar Animation */
        @keyframes eq-bounce {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }
        .eq-bar {
            width: 3px;
            background-color: #10b981;
            border-radius: 2px;
            animation: eq-bounce 0.8s ease-in-out infinite;
        }
        .eq-bar:nth-child(1) { animation-delay: 0.1s; }
        .eq-bar:nth-child(2) { animation-delay: 0.3s; }
        .eq-bar:nth-child(3) { animation-delay: 0.2s; }
        .eq-bar:nth-child(4) { animation-delay: 0.4s; }

        input[type="range"] {
            accent-color: #10b981;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen pb-36 font-sans selection:bg-emerald-500 selection:text-black">

    <!-- Persistent Header Navigation -->
    <nav class="bg-black/80 backdrop-blur-md sticky top-0 z-50 border-b border-zinc-900 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('home')">
            <div class="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center font-bold text-black text-lg tracking-wider shadow-lg shadow-emerald-500/20">S</div>
            <span class="font-bold tracking-tight text-xl bg-gradient-to-r from-white to-zinc-400 bg-clip-text text-transparent">SONAAR<span class="text-emerald-500 font-light text-sm ml-1">WAVE</span></span>
        </div>
        <div class="flex gap-6 font-medium text-sm">
            <button onclick="navigateTo('home')" id="nav-home" class="transition-colors cursor-pointer text-emerald-400 font-semibold">Home Hub</button>
            <button onclick="navigateTo('about')" id="nav-about" class="transition-colors cursor-pointer text-zinc-400 hover:text-zinc-200">About Band</button>
            <button onclick="navigateTo('contact')" id="nav-contact" class="transition-colors cursor-pointer text-zinc-400 hover:text-zinc-200">Bookings</button>
        </div>
    </nav>

    <!-- SPA Router View Container -->
    <main id="content-area" class="max-w-5xl mx-auto px-6 py-10 transition-all duration-300">
        <!-- Dynamic content injected here -->
    </main>

    <!-- Native Audio Engine -->
    <audio id="global-audio" preload="metadata"></audio>

    <!-- Sticky Bottom Sonaar Waveform Global Audio Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-zinc-900/95 backdrop-blur-xl border-t border-zinc-800 px-6 pt-2 pb-3 z-50 shadow-2xl flex flex-col justify-between">
        
        <!-- Sonaar Sticky Waveform Canvas Engine -->
        <div class="w-full relative px-2 mb-1">
            <div class="sr_progressbar_sticky flex flex-col w-full">
                <div id="sPlayer" class="wave sonaar_fake_wave reveal sonaar-wave-wrapper flex relative w-full h-10" onclick="seekAudioByWave(event, 'sticky')">
                    
                    <!-- Base Inactive Gray Wave -->
                    <div class="sonaar_wave_base flex w-full h-full">
                        <canvas id="splayer-wave-container" class="w-full h-10"></canvas>
                    </div>

                    <!-- Cut Active Emerald Wave -->
                    <div id="sticky-wave-cut" class="sonaar_wave_cut flex h-full" style="width: 0%;">
                        <canvas id="splayer-wave-progress" class="w-full h-10"></canvas>
                    </div>

                    <!-- Dynamic Playhead Scrubber Line -->
                    <div id="sticky-scrubber" class="scrubber-line" style="left: 0%;"></div>

                </div>
            </div>
        </div>

        <div class="flex items-center justify-between w-full">
            
            <!-- Track Info & Art -->
            <div class="flex items-center gap-4 w-1/4 min-w-[220px]">
                <img id="player-art" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150&auto=format&fit=crop&q=80" alt="Cover Art" class="w-12 h-12 rounded-lg object-cover bg-zinc-800 shadow-md border border-zinc-800">
                <div class="truncate">
                    <div class="flex items-center gap-2">
                        <h4 id="player-title" class="font-semibold text-sm text-zinc-100 truncate">House Party 93</h4>
                        <!-- Live Playing EQ Pulse -->
                        <div id="sticky-eq" class="hidden items-end gap-0.5 h-4">
                            <div class="eq-bar"></div>
                            <div class="eq-bar"></div>
                            <div class="eq-bar"></div>
                            <div class="eq-bar"></div>
                        </div>
                    </div>
                    <p id="player-artist" class="text-xs text-zinc-400 truncate mt-0.5">DJ Sonaar Robot</p>
                </div>
            </div>

            <!-- Player Controls -->
            <div class="flex items-center gap-6">
                <!-- Current / Duration Timers -->
                <div class="timing flex items-center gap-1.5 text-xs text-zinc-400 font-mono">
                    <div id="time-current">00:00</div>
                    <span class="text-zinc-600">/</span>
                    <div id="time-total">00:00</div>
                </div>

                <div class="control flex items-center gap-4">
                    <button onclick="playPrevious()" title="Previous Track" class="text-zinc-400 hover:text-white transition-colors cursor-pointer">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>

                    <button onclick="togglePlay()" id="playPause" title="Play / Pause" class="w-11 h-11 rounded-full bg-emerald-500 text-black flex items-center justify-center font-bold hover:scale-105 transition-transform shadow-lg shadow-emerald-500/20 cursor-pointer">
                        <svg class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>

                    <button onclick="playNext()" title="Next Track" class="text-zinc-400 hover:text-white transition-colors cursor-pointer">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zm-10.5 0v12l8.5-6z"/></svg>
                    </button>
                </div>
            </div>

            <!-- Volume Control -->
            <div class="flex items-center justify-end gap-4 w-1/4">
                <svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M12 18.75V5.25L7.75 9.5H4.5v5h3.25L12 18.75z"/></svg>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.8" oninput="adjustVolume(this.value)" class="w-20 h-1 bg-zinc-700 rounded-lg appearance-none cursor-pointer">
            </div>

        </div>
    </div>

    <script>
        // Highly Reliable Public Audio Streams
        const playlist = [
            { 
                id: 0, 
                title: "House Party 93", 
                artist: "DJ Sonaar Robot", 
                duration: "2:39",
                src: "https://actions.google.com/sounds/v1/ambiences/outdoor_synth_drone.ogg", 
                art: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150&auto=format&fit=crop&q=80" 
            },
            { 
                id: 1, 
                title: "Cloudways", 
                artist: "DJ Sonaar Robot", 
                duration: "2:35",
                src: "https://actions.google.com/sounds/v1/science_fiction/space_engine_large.ogg", 
                art: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=150&auto=format&fit=crop&q=80" 
            },
            { 
                id: 2, 
                title: "The Piano Intro", 
                artist: "DJ Sonaar Robot", 
                duration: "1:49",
                src: "https://actions.google.com/sounds/v1/ambiences/heavy_rain_with_thunder.ogg", 
                art: "https://images.unsplash.com/photo-1520523839897-bd0b52f945a0?w=150&auto=format&fit=crop&q=80" 
            },
            { 
                id: 3, 
                title: "Driving the City", 
                artist: "DJ Sonaar Robot", 
                duration: "2:30",
                src: "https://actions.google.com/sounds/v1/weather/wind_synth.ogg", 
                art: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=150&auto=format&fit=crop&q=80" 
            }
        ];

        let currentTrackIndex = 0;
        const audio = document.getElementById('global-audio');
        const playPauseBtn = document.getElementById('playPause');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');
        const stickyEq = document.getElementById('sticky-eq');

        // Pre-computed Dense Sonaar Peaks Cache
        const waveformPeaks = {};

        function generatePeaks(trackId, count = 220) {
            if (waveformPeaks[trackId]) return waveformPeaks[trackId];
            const peaks = [];
            let seed = (trackId + 1) * 98765;
            for (let i = 0; i < count; i++) {
                seed = (seed * 9301 + 49297) % 233280;
                const rnd = seed / 233280;
                const envelope = Math.sin((i / count) * Math.PI); 
                const val = (Math.sin(i * 0.15) * 0.3 + rnd * 0.7) * (0.3 + envelope * 0.7);
                peaks.push(Math.max(0.12, val));
            }
            waveformPeaks[trackId] = peaks;
            return peaks;
        }

        // HiDPI Crisp Waveform Canvas Drawing Engine
        function renderWaveformCanvas(canvasId, peaks, color) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            
            const rect = canvas.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;

            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);

            ctx.clearRect(0, 0, rect.width, rect.height);
            ctx.fillStyle = color;

            const barWidth = 2;
            const gap = 1;
            const totalBars = Math.floor(rect.width / (barWidth + gap));
            const step = peaks.length / totalBars;

            for (let i = 0; i < totalBars; i++) {
                const peakIndex = Math.floor(i * step);
                const height = (peaks[peakIndex] || 0.2) * (rect.height - 4);
                const x = i * (barWidth + gap);
                const y = (rect.height - height) / 2;
                
                ctx.beginPath();
                ctx.roundRect(x, y, barWidth, height, 1);
                ctx.fill();
            }
        }

        function drawStickyWaveform() {
            const peaks = generatePeaks(currentTrackIndex);
            renderWaveformCanvas('splayer-wave-container', peaks, '#52525b');
            renderWaveformCanvas('splayer-wave-progress', peaks, '#10b981');
        }

        function drawInlineWaveforms() {
            playlist.forEach(track => {
                const peaks = generatePeaks(track.id);
                renderWaveformCanvas(`inline-wave-base-${track.id}`, peaks, '#52525b');
                renderWaveformCanvas(`inline-wave-progress-${track.id}`, peaks, '#10b981');
            });
        }

        // Audio Event Handling
        audio.volume = 0.8;

        audio.addEventListener('play', () => {
            playPauseBtn.innerHTML = `<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
            stickyEq.classList.remove('hidden');
            stickyEq.classList.add('flex');
            updateInlineState(currentTrackIndex, true);
        });

        audio.addEventListener('pause', () => {
            playPauseBtn.innerHTML = `<svg class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
            stickyEq.classList.add('hidden');
            stickyEq.classList.remove('flex');
            updateInlineState(currentTrackIndex, false);
        });

        audio.addEventListener('timeupdate', () => {
            if (!isNaN(audio.duration) && audio.duration > 0) {
                const percentage = (audio.currentTime / audio.duration) * 100;
                
                // Sticky Progress Cut & Scrubber Position
                const stickyCut = document.getElementById('sticky-wave-cut');
                const stickyScrubber = document.getElementById('sticky-scrubber');
                if (stickyCut) stickyCut.style.width = `${percentage}%`;
                if (stickyScrubber) stickyScrubber.style.left = `${percentage}%`;

                // Active Track Inline Cut & Scrubber Position
                const inlineCut = document.getElementById(`inline-wave-cut-${currentTrackIndex}`);
                const inlineScrubber = document.getElementById(`inline-scrubber-${currentTrackIndex}`);
                if (inlineCut) inlineCut.style.width = `${percentage}%`;
                if (inlineScrubber) inlineScrubber.style.left = `${percentage}%`;

                timeCurrent.innerText = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            timeTotal.innerText = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            playNext();
        });

        // Core Control Business Logic
        function loadTrack(index) {
            // Reset previous track state
            const oldCut = document.getElementById(`inline-wave-cut-${currentTrackIndex}`);
            const oldScrubber = document.getElementById(`inline-scrubber-${currentTrackIndex}`);
            if (oldCut) oldCut.style.width = '0%';
            if (oldScrubber) oldScrubber.style.left = '0%';
            updateInlineState(currentTrackIndex, false);

            currentTrackIndex = index;
            const track = playlist[index];
            audio.src = track.src;

            document.getElementById('player-title').innerText = track.title;
            document.getElementById('player-artist').innerText = track.artist;
            document.getElementById('player-art').src = track.art;

            drawStickyWaveform();
        }

        function playTrack(index) {
            if (currentTrackIndex !== index || !audio.src) {
                loadTrack(index);
            }
            if (audio.paused) {
                audio.play().catch(err => console.warn("Playback gesture requirement:", err));
            } else {
                audio.pause();
            }
        }

        function togglePlay() {
            if (!audio.src) {
                loadTrack(0);
            }
            if (audio.paused) {
                audio.play().catch(err => console.warn("Playback gesture requirement:", err));
            } else {
                audio.pause();
            }
        }

        function playNext() {
            let nextIndex = (currentTrackIndex + 1) % playlist.length;
            playTrack(nextIndex);
        }

        function playPrevious() {
            let prevIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            playTrack(prevIndex);
        }

        function seekAudioByWave(e, type, trackId = null) {
            if (type === 'inline' && trackId !== currentTrackIndex) {
                playTrack(trackId);
            }
            const container = e.currentTarget;
            const rect = container.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percentage = Math.max(0, Math.min(1, clickX / rect.width));

            if (!isNaN(audio.duration) && audio.duration > 0) {
                audio.currentTime = percentage * audio.duration;
            }
        }

        function adjustVolume(val) {
            audio.volume = val;
        }

        function formatTime(secs) {
            const minutes = Math.floor(secs / 60) || 0;
            const seconds = Math.floor(secs % 60) || 0;
            return `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        function updateInlineState(index, isPlaying) {
            playlist.forEach(track => {
                const card = document.getElementById(`track-card-${track.id}`);
                const btn = document.getElementById(`inline-btn-${track.id}`);
                const eq = document.getElementById(`inline-eq-${track.id}`);

                if (track.id === index && isPlaying) {
                    if (card) {
                        card.classList.add('border-emerald-500/60', 'bg-zinc-900/90');
                        card.classList.remove('border-zinc-800/80');
                    }
                    if (btn) btn.innerHTML = `<svg class="w-4 h-4 text-emerald-400" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
                    if (eq) {
                        eq.classList.remove('hidden');
                        eq.classList.add('flex');
                    }
                } else {
                    if (card) {
                        card.classList.remove('border-emerald-500/60', 'bg-zinc-900/90');
                        card.classList.add('border-zinc-800/80');
                    }
                    if (btn) btn.innerHTML = `<svg class="w-4 h-4 text-emerald-400" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
                    if (eq) {
                        eq.classList.add('hidden');
                        eq.classList.remove('flex');
                    }
                }
            });
        }

        // SPA Views
        const pages = {
            home: `
                <div class="bg-zinc-900/60 border border-zinc-800 rounded-2xl p-8 shadow-xl">
                    <div class="flex items-center justify-between mb-8">
                        <div>
                            <h2 class="text-2xl font-bold tracking-tight text-white">Featured Beat Catalog</h2>
                            <p class="text-zinc-400 text-sm mt-1">Interactive Sonaar-style audio waveform navigation</p>
                        </div>
                        <span class="bg-emerald-500/10 text-emerald-400 text-xs font-semibold px-3 py-1 rounded-full border border-emerald-500/20">LIVE WAVE</span>
                    </div>

                    <div class="flex flex-col gap-5">
                        ${playlist.map(track => `
                            <div id="track-card-${track.id}" class="bg-zinc-900 border border-zinc-800/80 p-4 rounded-xl flex items-center justify-between gap-6 hover:border-zinc-700 transition-all shadow-sm">
                                
                                <div class="flex items-center gap-4 w-1/3 min-w-[210px]">
                                    <img src="${track.art}" class="w-14 h-14 rounded-lg object-cover bg-zinc-800 border border-zinc-800 shadow">
                                    <button id="inline-btn-${track.id}" onclick="playTrack(${track.id})" class="w-9 h-9 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center shrink-0 hover:scale-105 transition-transform cursor-pointer">
                                        <svg class="w-4 h-4 text-emerald-400" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                    </button>
                                    <div class="truncate">
                                        <div class="flex items-center gap-2">
                                            <h3 class="font-semibold text-zinc-100 text-sm truncate">${track.title}</h3>
                                            <div id="inline-eq-${track.id}" class="hidden items-end gap-0.5 h-3.5">
                                                <div class="eq-bar"></div>
                                                <div class="eq-bar"></div>
                                                <div class="eq-bar"></div>
                                                <div class="eq-bar"></div>
                                            </div>
                                        </div>
                                        <p class="text-xs text-zinc-400 truncate mt-0.5">${track.artist}</p>
                                    </div>
                                </div>

                                <!-- Inline Sonaar Waveform Canvas Structure -->
                                <div class="flex-1 sonaar-wave-wrapper flex relative h-10" onclick="seekAudioByWave(event, 'inline', ${track.id})">
                                    <div class="sonaar_wave_base flex w-full h-full">
                                        <canvas id="inline-wave-base-${track.id}" class="w-full h-10"></canvas>
                                    </div>
                                    <div id="inline-wave-cut-${track.id}" class="sonaar_wave_cut flex h-full" style="width: 0%;">
                                        <canvas id="inline-wave-progress-${track.id}" class="w-full h-10"></canvas>
                                    </div>
                                    <div id="inline-scrubber-${track.id}" class="scrubber-line" style="left: 0%;"></div>
                                </div>

                                <div class="flex items-center gap-4 text-xs font-mono text-zinc-400">
                                    <span>${track.duration}</span>
                                    <button class="bg-purple-600 hover:bg-purple-700 text-white font-semibold text-xs px-3.5 py-2 rounded-lg transition-colors flex items-center gap-1.5 cursor-pointer">
                                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                                        DOWNLOAD
                                    </button>
                                </div>

                            </div>
                        `).join('')}
                    </div>
                </div>
            `,
            about: `
                <div class="bg-zinc-900/60 border border-zinc-800 rounded-2xl p-8 max-w-3xl mx-auto shadow-xl">
                    <h2 class="text-3xl font-bold text-white mb-4">About Sonaar Waveform Engine</h2>
                    <p class="text-zinc-300 leading-relaxed mb-6">
                        This player utilizes Sonaar's dual HTML5 canvas system (<code class="text-emerald-400">sonaar_wave_base</code> and <code class="text-emerald-400">sonaar_wave_cut</code>) with active playhead scrubbers to replicate exact MP3 waveform playback behavior without stream interruptions.
                    </p>
                </div>
            `,
            contact: `
                <div class="bg-zinc-900/60 border border-zinc-800 rounded-2xl p-8 max-w-xl mx-auto shadow-xl">
                    <h2 class="text-2xl font-bold text-white mb-6">Booking & Inquiries</h2>
                    <form class="space-y-4" onsubmit="event.preventDefault(); alert('Inquiry submitted!');">
                        <div>
                            <label class="block text-xs font-semibold text-zinc-400 mb-1 uppercase tracking-wider">Your Name</label>
                            <input type="text" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2.5 text-zinc-100 focus:outline-none focus:border-emerald-500" placeholder="Artist / Label" required>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-zinc-400 mb-1 uppercase tracking-wider">Email Address</label>
                            <input type="email" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-2.5 text-zinc-100 focus:outline-none focus:border-emerald-500" placeholder="artist@sonaar.io" required>
                        </div>
                        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-bold py-3 rounded-lg transition-colors cursor-pointer">
                            Submit Inquiry
                        </button>
                    </form>
                </div>
            `
        };

        function navigateTo(pageId) {
            document.getElementById('content-area').innerHTML = pages[pageId];
            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('text-emerald-400', 'font-semibold');
                btn.classList.add('text-zinc-400');
            });
            const activeLink = document.getElementById(`nav-${pageId}`);
            if (activeLink) {
                activeLink.classList.remove('text-zinc-400');
                activeLink.classList.add('text-emerald-400', 'font-semibold');
            }

            if (pageId === 'home') {
                setTimeout(() => {
                    drawInlineWaveforms();
                    updateInlineState(currentTrackIndex, !audio.paused);
                }, 50);
            }
        }

        // Initialize App Landing View
        navigateTo('home');
        loadTrack(0);

        window.addEventListener('resize', () => {
            drawStickyWaveform();
