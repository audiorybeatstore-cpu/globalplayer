<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Audio Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0f0f0f; /* Deep dark background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Main Player Container */
        .player-bar {
            width: 100%;
            max-width: 1400px;
            height: 86px;
            background-color: #000000;
            display: flex;
            align-items: center;
            padding: 0 24px;
            color: #ffffff;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
        }

        /* --- LEFT: Track Info --- */
        .player-left {
            display: flex;
            align-items: center;
            width: 250px;
            flex-shrink: 0;
        }

        .cover-art {
            width: 52px;
            height: 52px;
            background-color: #222;
            background-image: url('https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=150&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            border-radius: 4px;
            margin-right: 16px;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .track-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .track-artist {
            font-size: 12px;
            color: #999;
        }

        /* --- CENTER: Controls & Waveform --- */
        .player-center {
            display: flex;
            align-items: center;
            flex-grow: 1;
            padding: 0 20px;
            gap: 24px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .control-btn {
            background: none;
            border: none;
            color: #b3b3b3;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: color 0.2s, transform 0.1s;
        }

        .control-btn:hover {
            color: #ffffff;
            transform: scale(1.05);
        }

        /* Specific Icon Sizes */
        .control-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
        
        .play-btn svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
        }

        /* --- WAVEFORM CONTAINER --- */
        .waveform-container {
            flex-grow: 1;
            height: 40px;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .waveform-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* The played portion of the waveform */
        .waveform-played {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            overflow: hidden;
            pointer-events: none; /* Let clicks pass through to container */
            width: 0%; /* Changed by JS */
            border-right: 1px solid #fff; /* The playhead line */
        }
        
        .waveform-played svg {
            /* Ensure the played SVG exactly matches the background SVG width */
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100vw; /* Force it to be wide enough */
            max-width: 1200px; /* Match roughly the container max-width */
        }

        .bar {
            fill: #555; /* Unplayed color */
            transition: fill 0.1s;
        }
        
        .bar:hover {
            fill: #888;
        }

        /* Played bars change to white */
        .waveform-played .bar {
            fill: #ffffff;
        }

        /* --- RIGHT: Time --- */
        .player-right {
            display: flex;
            align-items: center;
            width: 100px;
            justify-content: flex-end;
            font-size: 12px;
            color: #888;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .player-left { width: 180px; }
            .track-title { font-size: 13px; }
            .controls { gap: 10px; }
            .player-right { display: none; } /* Hide time on mobile */
        }
    </style>
</head>
<body>

    <div class="player-bar">
        
        <!-- Left: Album Info -->
        <div class="player-left">
            <div class="cover-art"></div>
            <div class="track-info">
                <div class="track-title">Tempus Illusio</div>
                <div class="track-artist">Golden Age</div>
            </div>
        </div>

        <!-- Center: Controls & Waveform -->
        <div class="player-center">
            <div class="controls">
                <!-- Playlist / Menu -->
                <button class="control-btn" aria-label="Menu">
                    <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
                </button>
                
                <!-- Previous -->
                <button class="control-btn" aria-label="Previous">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                
                <!-- Play / Pause -->
                <button class="control-btn play-btn" id="playPauseBtn" aria-label="Play">
                    <!-- Play Icon -->
                    <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <!-- Pause Icon (Hidden by default) -->
                    <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                
                <!-- Next -->
                <button class="control-btn" aria-label="Next">
                    <svg viewBox="0 0 24 24"><path d="M16 18h2V6h-2zM6 18l8.5-6L6 6z"/></svg>
                </button>
                
                <!-- Shuffle -->
                <button class="control-btn" aria-label="Shuffle">
                    <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                </button>
                
                <!-- Repeat -->
                <button class="control-btn" aria-label="Repeat">
                    <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                </button>
            </div>

            <!-- Waveform Area -->
            <div class="waveform-container" id="waveform">
                <!-- Base Layer (Unplayed) -->
                <svg class="waveform-svg" id="waveSvgBg" preserveAspectRatio="none"></svg>
                <!-- Played Layer (White) -->
                <div class="waveform-played" id="wavePlayedContainer">
                    <svg class="waveform-svg" id="waveSvgFg" preserveAspectRatio="none"></svg>
                </div>
            </div>
        </div>

        <!-- Right: Time -->
        <div class="player-right">
            <span id="timeDisplay">0:00 / 3:45</span>
        </div>

    </div>

    <script>
        // DOM Elements
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const waveformContainer = document.getElementById('waveform');
        const waveSvgBg = document.getElementById('waveSvgBg');
        const waveSvgFg = document.getElementById('waveSvgFg');
        const wavePlayedContainer = document.getElementById('wavePlayedContainer');
        const timeDisplay = document.getElementById('timeDisplay');

        // State
        let isPlaying = false;
        let progress = 42; // Starting progress (%) to match image
        let totalDurationSeconds = 225; // 3:45
        let animationInterval;
        
        // Waveform settings
        const barCount = 160; // Number of bars to draw
        const barWidth = 2;
        const barGap = 2; 

        // 1. Generate Realistic Waveform Data
        function generateWaveform() {
            let bgHtml = '';
            let fgHtml = '';
            
            // Use a sine wave mixed with random noise to simulate a real audio track
            for (let i = 0; i < barCount; i++) {
                // Create an envelope (louder in the middle, quieter at start/end)
                let envelope = Math.sin((i / barCount) * Math.PI); 
                
                // Add randomness for the "audio" peaks and valleys
                let randomNoise = (Math.random() * 0.8) + 0.2; 
                
                // Calculate height percentage (between 15% and 100%)
                let heightPercent = (envelope * randomNoise) * 100;
                // Ensure minimum visible height
                if (heightPercent < 10) heightPercent = 10; 

                // Calculate X position
                let x = i * (barWidth + barGap);
                
                // Create SVG rectangle path
                // We center the bar vertically (y starts at 50%, height goes up/down)
                let y = 50 - (heightPercent / 2);
                
                let rect = `<rect class="bar" x="${x}" y="${y}%" width="${barWidth}" height="${heightPercent}%" rx="1"></rect>`;
                
                bgHtml += rect;
                fgHtml += rect; 
            }

            // Inject the generated shapes into the SVGs
            waveSvgBg.innerHTML = bgHtml;
            waveSvgFg.innerHTML = fgHtml;
            
            // Set the SVG viewBox to match the calculated width perfectly
            const totalWidth = barCount * (barWidth + barGap);
            waveSvgBg.setAttribute('viewBox', `0 0 ${totalWidth} 100`);
            waveSvgFg.setAttribute('viewBox', `0 0 ${totalWidth} 100`);
            
            // Ensure both SVGs are the same physical width so they line up perfectly
            waveSvgBg.style.width = '100%';
            waveSvgFg.style.width = '100%';
        }

        // 2. Format Time
        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // 3. Update UI (Progress & Time)
        function updateUI() {
            // Update the width of the "played" container to clip the white waveform
            wavePlayedContainer.style.width = progress + '%';
            
            // Update the time display
            const currentSeconds = (progress / 100) * totalDurationSeconds;
            timeDisplay.textContent = `${formatTime(currentSeconds)} / ${formatTime(totalDurationSeconds)}`;
        }

        // 4. Play / Pause Logic
        playPauseBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            
            if (isPlaying) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                
                // Start simulated playback
                animationInterval = setInterval(() => {
                    if (progress < 100) {
                        // Increment progress
                        progress += 0.15; 
                        if (progress > 100) progress = 100;
                        updateUI();
                    } else {
                        // Reset at end
                        clearInterval(animationInterval);
                        isPlaying = false;
                        playIcon.style.display = 'block';
                        pauseIcon.style.display = 'none';
                        progress = 0;
                        updateUI();
                    }
                }, 100);

            } else {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                clearInterval(animationInterval);
            }
        });

        // 5. Seek Logic (Click on waveform)
        waveformContainer.addEventListener('click', (e) => {
            const rect = waveformContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            
            // Calculate percentage
            let newProgress = (clickX / width) * 100;
            newProgress = Math.max(0, Math.min(100, newProgress));
            
            progress = newProgress;
            updateUI();
        });

        // Initialize
        generateWaveform();
        updateUI();
    </script>
</body>
</html>
