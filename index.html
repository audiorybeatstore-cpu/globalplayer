<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Audio Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* --- Main Player Bar --- */
        .player-bar {
            width: 100%;
            max-width: 1400px;
            height: 80px;
            background-color: #000000;
            display: flex;
            align-items: center;
            color: #ffffff;
            border-top: 1px solid #222;
            border-bottom: 1px solid #222;
            overflow: hidden;
        }

        /* --- Left: Track Info --- */
        .player-left {
            display: flex;
            align-items: center;
            width: 280px;
            padding-left: 20px;
            flex-shrink: 0;
            height: 100%;
            /* Border removed to match screenshot */
        }

        .cover-art {
            width: 48px;
            height: 48px;
            background-color: #222;
            background-image: url('https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=150&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            margin-right: 16px;
            border-radius: 2px;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .track-title {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .track-artist {
            font-size: 12px;
            color: #999;
        }

        /* --- Center: Controls & Waveform --- */
        .player-center {
            display: flex;
            align-items: center;
            flex-grow: 1;
            height: 100%;
            padding: 0 20px;
            gap: 20px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .control-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0.8;
            transition: opacity 0.2s, transform 0.1s;
        }

        .control-btn:hover {
            opacity: 1;
            transform: scale(1.05);
        }

        .control-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
        
        /* The Play Button */
        .play-btn svg {
            width: 24px;
            height: 24px;
            fill: #fff;
        }

        /* Current Time */
        .current-time {
            font-size: 11px;
            color: #fff;
            font-variant-numeric: tabular-nums;
            margin-left: 4px;
        }

        /* --- Waveform Container --- */
        .waveform-container {
            flex-grow: 1;
            height: 40px;
            position: relative;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .waveform-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Played (Teal) Overlay */
        .waveform-played {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            width: 0%; 
            border-right: 1px solid #00e09e;
        }
        
        .waveform-played svg {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100vw; 
            max-width: 1000px; /* Matches container size roughly */
        }

        /* Base Unplayed Bars */
        .bar-bg {
            fill: #444; 
        }

        /* Played Teal Bars */
        .waveform-played .bar-fg {
            fill: #00e09e; 
        }

        /* Remaining Time */
        .remaining-time {
            font-size: 11px;
            color: #999;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        /* --- Right: Extras (Hidden to match your latest screenshot exactly) --- */
        .player-right {
            display: none; /* The latest screenshot didn't have the download/spotify icons */
        }

        /* Adjustments for smaller screens */
        @media (max-width: 768px) {
            .player-left { width: 200px; }
            .controls { gap: 10px; }
        }
    </style>
</head>
<body>

    <div class="player-bar">
        
        <!-- Left -->
        <div class="player-left">
            <div class="cover-art"></div>
            <div class="track-info">
                <div class="track-title">Tempus Illusio</div>
                <div class="track-artist">Golden Age</div>
            </div>
        </div>

        <!-- Center -->
        <div class="player-center">
            
            <div class="controls">
                <!-- Menu -->
                <button class="control-btn" aria-label="Menu">
                    <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
                </button>
                
                <!-- Prev -->
                <button class="control-btn" aria-label="Previous">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                
                <!-- Play/Pause -->
                <button class="control-btn play-btn" id="playPauseBtn" aria-label="Play">
                    <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                
                <!-- Next -->
                <button class="control-btn" aria-label="Next">
                    <svg viewBox="0 0 24 24"><path d="M16 18h2V6h-2zM6 18l8.5-6L6 6z"/></svg>
                </button>
                
                <!-- Shuffle -->
                <button class="control-btn" aria-label="Shuffle">
                    <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                </button>
                
                <!-- Repeat -->
                <button class="control-btn" aria-label="Repeat">
                    <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                </button>

                <span class="current-time" id="currentTime">00:25</span>
            </div>

            <!-- Waveform -->
            <div class="waveform-container" id="waveform">
                <svg class="waveform-svg" id="waveSvgBg" preserveAspectRatio="none"></svg>
                <div class="waveform-played" id="wavePlayedContainer">
                    <svg class="waveform-svg" id="waveSvgFg" preserveAspectRatio="none"></svg>
                </div>
            </div>

            <span class="remaining-time" id="remainingTime">-03:19</span>
        </div>

    </div>

    <script>
        // DOM Elements
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const waveformContainer = document.getElementById('waveform');
        const waveSvgBg = document.getElementById('waveSvgBg');
        const waveSvgFg = document.getElementById('waveSvgFg');
        const wavePlayedContainer = document.getElementById('wavePlayedContainer');
        const currentTimeDisplay = document.getElementById('currentTime');
        const remainingTimeDisplay = document.getElementById('remainingTime');

        // Player State
        let isPlaying = false; 
        let progress = 11.5; // Start at exactly 25 seconds (approx 11.5% of 225s)
        let totalDurationSeconds = 224; // 3:44
        let animationInterval;
        
        // Waveform Settings
        const barCount = 350; // Lots of bars for a dense look
        const barWidth = 1;
        const barGap = 1.5; 

        // 1. Generate Realistic, Spiky Waveform
        function generateWaveform() {
            let bgHtml = '';
            let fgHtml = '';
            
            for (let i = 0; i < barCount; i++) {
                // Create a pseudo-random "audio" pattern
                // Math.sin creates the general shape, random creates the spikes
                let envelope = Math.sin((i / barCount) * Math.PI * 2) * 0.5 + 0.5; // 0 to 1
                let envelope2 = Math.sin((i / barCount) * Math.PI * 15) * 0.3; // Faster ripples
                let noise = Math.random() * 0.8;
                
                // Combine them. Make it louder in the first half, quieter in the second half
                let baseHeight = Math.abs(envelope + envelope2 + noise) * 100;
                
                // Add an artificial "drop" at the end to match your screenshot
                if (i > barCount * 0.7) {
                    baseHeight = baseHeight * 0.3; 
                }

                // Ensure minimum height so bars don't disappear entirely
                let heightPercent = Math.max(10, Math.min(100, baseHeight)); 
                
                // Draw from center (50%)
                let x = i * (barWidth + barGap);
                let y = 50 - (heightPercent / 2);
                
                // Add rounded corners (rx) to the bars for that polished look
                let rectBg = `<rect class="bar-bg" x="${x}" y="${y}%" width="${barWidth}" height="${heightPercent}%" rx="0.5"></rect>`;
                let rectFg = `<rect class="bar-fg" x="${x}" y="${y}%" width="${barWidth}" height="${heightPercent}%" rx="0.5"></rect>`;
                
                bgHtml += rectBg;
                fgHtml += rectFg; 
            }

            waveSvgBg.innerHTML = bgHtml;
            waveSvgFg.innerHTML = fgHtml;
            
            // Set viewBox perfectly so no stretching occurs
            const totalWidth = barCount * (barWidth + barGap);
            waveSvgBg.setAttribute('viewBox', `0 0 ${totalWidth} 100`);
            waveSvgFg.setAttribute('viewBox', `0 0 ${totalWidth} 100`);
        }

        // 2. Format Time
        function formatTime(seconds) {
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min < 10 ? '0' : ''}${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // 3. Update UI
        function updateUI() {
            wavePlayedContainer.style.width = progress + '%';
            
            const currentSeconds = (progress / 100) * totalDurationSeconds;
            const remainingSeconds = totalDurationSeconds - currentSeconds;
            
            currentTimeDisplay.textContent = formatTime(currentSeconds);
            remainingTimeDisplay.textContent = `-${formatTime(remainingSeconds)}`;
        }

        // 4. Play/Pause Toggle
        playPauseBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            
            if (isPlaying) {
                // Change to Pause Icon
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                
                // Start animation loop
                animationInterval = setInterval(() => {
                    if (progress < 100) {
                        // Progress speed (adjust to feel like real time)
                        progress += 0.05; 
                        if (progress > 100) progress = 100;
                        updateUI();
                    } else {
                        clearInterval(animationInterval);
                        isPlaying = false;
                        playIcon.style.display = 'block';
                        pauseIcon.style.display = 'none';
                    }
                }, 100);
            } else {
                // Change to Play Icon
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                clearInterval(animationInterval);
            }
        });

        // 5. Seek on Waveform Click
        waveformContainer.addEventListener('click', (e) => {
            const rect = waveformContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = rect.width;
            
            let newProgress = (clickX / width) * 100;
            newProgress = Math.max(0, Math.min(100, newProgress));
            
            progress = newProgress;
            updateUI();
        });

        // Initialize
        generateWaveform();
        updateUI(); // Sets it to the default state (Play icon, 00:25)
    </script>
</body>
</html>
